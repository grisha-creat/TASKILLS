<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Step Guides{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/"><strong>Step Guides</strong></a></li></ul>
      <ul>
        <li><a href="/">Каталог</a></li>
        {% if current_user %}
          <li><a href="/my">Мои инструкции</a></li>
          <li>
            <form method="post" action="/auth/logout" class="inline-form">
              <button type="submit" class="secondary outline">Выйти ({{ current_user.username }})</button>
            </form>
          </li>
        {% else %}
          <li><a href="/login">Войти</a></li>
          <li><a href="/register" role="button">Регистрация</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
